name: Verify and build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_url:
        description: HTTPS API URL ending in /api/v1/
        required: true
        default: https://studycontrol-api.onrender.com/api/v1/
permissions:
  contents: read
concurrency:
  group: smartstudy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-study-control
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: study
          POSTGRES_PASSWORD: ephemeral-ci-test-password
          POSTGRES_DB: study_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U study -d study_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      JWT_SECRET: ci-only-secret-not-for-deployment-0123456789abcdef
      DATABASE_URL: postgresql+psycopg://study:ephemeral-ci-test-password@localhost:5432/study_test
      TEST_DATABASE_URL: postgresql+psycopg://study:ephemeral-ci-test-password@localhost:5432/study_test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: smart-study-control/backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng
      - run: ruff check backend
      - run: alembic upgrade head && alembic check
        working-directory: smart-study-control/backend
      - run: pytest -q
        working-directory: smart-study-control/backend
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: smart-study-control/android
    env:
      STUDY_API_URL: ${{ inputs.api_url || 'https://studycontrol-api.onrender.com/api/v1/' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate public API URL
        working-directory: .
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          value = os.environ['STUDY_API_URL']
          parsed = urlsplit(value)
          assert parsed.scheme == 'https' and parsed.hostname, 'HTTPS URL required'
          assert not parsed.username and not parsed.password and not parsed.query and not parsed.fragment
          assert all(c not in value for c in ('"', '\\', '\n', '\r', '$')), 'Invalid URL'
          assert value.endswith('/api/v1/'), 'API must end in /api/v1/'
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: chmod +x gradlew
      - name: Test and build installable test APK
        run: ./gradlew :domain:test testDebugUnitTest assembleDebug assembleDebugAndroidTest "-PDEBUG_API_URL=$STUDY_API_URL"
      - name: Name APK and checksum
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/SmartStudy-0.4.2-test.apk
          cd app/build/outputs/apk/debug
          sha256sum SmartStudy-0.4.2-test.apk > SmartStudy-0.4.2-test.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SmartStudy-0.4.2-test-apk
          path: |
            smart-study-control/android/app/build/outputs/apk/debug/SmartStudy-0.4.2-test.apk
            smart-study-control/android/app/build/outputs/apk/debug/SmartStudy-0.4.2-test.apk.sha256
          if-no-files-found: error
          retention-days: 30
  publish-preview:
    needs: [backend, apk]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SmartStudy-0.4.2-test-apk
          path: apk
      - name: Publish tested preview APK
        run: |
          cat > notes.md <<'NOTES'
          Android 0.4.2 test build with animated SMART STUDY branding, reading illustration, book-first dashboard and live HTTPS API connection.

          This is a debug-signed preview. Device Owner, alarm/camera/location hardware behavior still requires real-device qualification. A production update requires a stable release signing key. Do not uninstall an existing app without preserving its data.
          NOTES
          tag="v0.4.2-preview-${GITHUB_SHA:0:7}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" apk/* --target "$GITHUB_SHA" --title 'Smart Study 0.4.2 preview' --notes-file notes.md --prerelease
          fi
