# Free demo: database persists in Supabase; uploaded files on this API are temporary.
services:
  - type: keyvalue
    name: studycontrol-cache
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction
  - type: web
    name: studycontrol-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: smart-study-control
    dockerfilePath: infrastructure/docker/backend.Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: studycontrol-cache
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: PASSKEY_ORIGIN
        sync: false
      - key: PASSKEY_RP_ID
        sync: false
      - key: BOOTSTRAP_SUPERADMIN_LOGIN
        sync: false
      - key: BOOTSTRAP_SUPERADMIN_PASSWORD
        sync: false
      - key: UPLOAD_DIR
        value: /data/uploads
  - type: web
    name: studycontrol-web
    runtime: static
    rootDir: smart-study-control/admin-web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
