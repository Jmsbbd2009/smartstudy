name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: study
          POSTGRES_PASSWORD: ephemeral-ci-test-password
          POSTGRES_DB: study_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U study -d study_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      JWT_SECRET: ci-only-secret-not-for-deployment-0123456789abcdef
      DATABASE_URL: postgresql+psycopg://study:ephemeral-ci-test-password@localhost:5432/study_test
      TEST_DATABASE_URL: postgresql+psycopg://study:ephemeral-ci-test-password@localhost:5432/study_test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements*.txt}
      - run: pip install -r backend/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng
      - run: ruff check backend
      - run: alembic upgrade head
        working-directory: backend
      - run: alembic check
        working-directory: backend
      - run: pytest -q
        working-directory: backend
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew :domain:test testDebugUnitTest assembleDebug assembleDebugAndroidTest -PDEBUG_API_URL=${{ vars.STUDY_API_URL || 'http://10.0.2.2:8000/api/v1/' }}
        working-directory: android
      - uses: actions/upload-artifact@v4
        with: {name: smart-study-control-v0.4.2-debug-apk, path: android/app/build/outputs/apk/debug/*.apk}
