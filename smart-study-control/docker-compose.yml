services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: study
      POSTGRES_USER: study
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure.py first}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U study -d study"]
      interval: 5s
      retries: 15
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 10
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:8000:8000"]
    volumes: [private-uploads:/data/uploads]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready',timeout=3)"]
      interval: 15s
      retries: 5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
  autopilot:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    entrypoint: [python, -m, app.workers.autopilot]
    env_file: .env
    depends_on:
      api: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
  telegram:
    profiles: [telegram]
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    entrypoint: [python, -m, app.workers.telegram_bot]
    env_file: .env
    depends_on:
      api: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    ports: ["127.0.0.1:5173:8080"]
    depends_on:
      api: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
  private-uploads:
